<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AB Refractory | Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 750px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 35px;
        }

        .email {
            display: inline-block;
            padding: 15px 28px;
            background: white;
            color: #111827;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 17px;
            transition: 0.2s;
        }

        .email:hover {
            transform: translateY(-2px);
            background: #f3f4f6;
        }

        .footer {
            margin-top: 70px;
            font-size: 14px;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            p {
                font-size: 18px;
            }

            .logo {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            AB REFRACTORY
        </div>

        <h1>We're Building Something Great.</h1>

        <p>
            Our new website is currently under construction.
            We are working hard to bring you an improved experience.
            Please check back soon.
        </p>

        <p>
            For enquiries, please contact us:
        </p>

        <a class="email" href="mailto:YOUR_EMAIL@DOMAIN.COM">
            info@ab-refractory.com
        </a>

        <div class="footer">
            © 2026 AB Refractory. All rights reserved.
        </div>

    </div>

</body>
</html>
